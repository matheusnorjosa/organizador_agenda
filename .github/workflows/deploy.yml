name: Deploy

on:
  push:
    branches: [main]
    # Só o que entra na imagem justifica reiniciar o bot. Mudança em docs/,
    # tests/ ou .claude/ não afeta o container.
    paths:
      - 'src/**'
      - 'requirements.txt'
      - 'Dockerfile'
  # O disparo automático acima só funciona se o merge for feito com um PAT
  # (ver docs/setup_pat.md). Com o GITHUB_TOKEN o GitHub não encadeia
  # workflows, e aí este é o único caminho: gh workflow run deploy.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy na VM Oracle
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # Sem isto, uma falha no meio do script não interrompe o deploy e o
            # job termina "success" com o container rodando o código antigo.
            set -euo pipefail

            cd ~/organizador_agenda

            echo "::group::Atualizando o código"
            # git pull aborta quando há arquivo alterado na VM, e foi o que
            # deixou a produção parada por dias reportando sucesso. O deploy
            # espelha a main; o que é local (.env, tokens/, estado/) é
            # gitignored e não é tocado pelo reset.
            if [ -n "$(git status --porcelain)" ]; then
              echo "AVISO: alterações locais serão descartadas:"
              git status --short
            fi
            git fetch origin main
            git reset --hard origin/main
            echo "::endgroup::"

            commit_alvo=$(git rev-parse --short HEAD)
            echo "Publicando $commit_alvo"

            docker stop organizador-agenda 2>/dev/null || true
            docker rm organizador-agenda 2>/dev/null || true
            docker build -t organizador-agenda .
            docker run -d \
              --name organizador-agenda \
              --restart unless-stopped \
              --env-file .env \
              -v $(pwd)/credentials.json:/app/credentials.json \
              -v $(pwd)/tokens:/app/tokens \
              -v $(pwd)/users.json:/app/users.json \
              -v $(pwd)/estado:/app/estado \
              organizador-agenda

            # Confirma que subiu de verdade, em vez de confiar no exit code.
            sleep 5
            if [ -z "$(docker ps -q -f name=organizador-agenda -f status=running)" ]; then
              echo "ERRO: container não está rodando após o deploy"
              docker logs --tail 30 organizador-agenda || true
              exit 1
            fi
            echo "Container no ar com $commit_alvo"
            docker logs --tail 5 organizador-agenda

services:
  bot:
    build: .
    container_name: organizador-agenda
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./credentials.json:/app/credentials.json
      - ./tokens:/app/tokens
      - ./users.json:/app/users.json
      # Estado que precisa sobreviver ao restart (marco de eventos já avisados)
      - ./estado:/app/estado
